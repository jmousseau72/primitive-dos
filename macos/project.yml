# XcodeGen spec — the .xcodeproj is generated and gitignored; ALL project
# changes go through this file (manual Xcode tweaks are lost on regenerate):
#
#   xcodegen generate --spec macos/project.yml --project macos
#
# App Sandbox stays OFF deliberately: the engine shares
# ~/Library/Application Support/PrimitiveDos/presets.json with the Wails app,
# and sandboxing would silently fork that store into a container.
name: PrimitiveDos
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
targets:
  PrimitiveDos:
    type: application
    platform: macOS
    sources:
      - path: PrimitiveDos
    info:
      path: PrimitiveDos/Info.plist
      properties:
        CFBundleName: Primitive Dos
        CFBundleDisplayName: Primitive Dos
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleIconName: AppIcon
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Built on fogleman/primitive (MIT)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: Primitive Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleTypeIconFile: PrimDocument
            LSItemContentTypes:
              - com.jmousseau.primitivedos.prim
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.jmousseau.primitivedos.prim
            UTTypeDescription: Primitive Document
            UTTypeConformsTo:
              - public.data
            UTTypeIconFile: PrimDocument
            UTTypeTagSpecification:
              public.filename-extension:
                - prim
    settings:
      base:
        PRODUCT_NAME: Primitive Dos
        PRODUCT_BUNDLE_IDENTIFIER: com.jmousseau.primitivedos.mac
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: PrimitiveDos/Bridge/Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor
        OTHER_LDFLAGS: "-lprimitive -framework CoreFoundation -framework Security"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Go Bridge
        script: '"$SRCROOT/Scripts/build-bridge.sh"'
        basedOnDependencyAnalysis: false
